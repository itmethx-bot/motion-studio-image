name: Build Character Reference Upload
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-studio-reference-release
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare reviewed source and verify every file
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64,gzip,hashlib,json
          from pathlib import Path,PurePosixPath
          payload=base64.b64decode('',validate=True)
          assert hashlib.sha256(payload).hexdigest()=='f340d73a07cdd78a87770b95ee78af124223a9e76d0f1d6c93a5c9d343b5f31f'
          files=json.loads(gzip.decompress(payload))
          expected=json.loads('{".dockerignore":"5d840994a6bd404f9bdc1415a9024e6910cdcbc2f95ac56a524114e2df2e1ed9","Dockerfile":"574b098dc465794b831afd0017e5a7f0070e2170655c6fc037db038080de12d1","app.py":"103db068920f33852ce66ec66210288bf801ffb346f98991dcf95c85687c09a3","build-constraints.txt":"b92116e3af805c43571d51d0dece1edbec200c03da0517a0b42b9c11e273bf2d","build_nodes.py":"8955e1e3847d76d47a6fbc1bcef93d6c4f8f41155a1e64f3ec42427347a0b091","character-requirements.txt":"e7e3218eb560451fd79e01fb362d9352a9b6e41c8381260867a4fb75e6848ff0","config.example.env":"c904550e7bf09a3b9325cef3d2e451950ec9da51fc6b21d2d687c23c32f18afb","core.py":"378b18fdd5d42559746715492218966898c7c0e44ff76861bc1e435d522e0873","engine.py":"210f41645ab74569504f3c20b4191beebb175511812b1975c0460ff78a42f7c3","entrypoint.sh":"9d22eeccee7ce6a7b7baf1131f420f0293cbc995d1f3aafad29eb6a8d76b0f4c","extra_model_paths.yaml":"6319df78e29c3c09b99a035cd78fe09a0c8fc5a344fea8782cbce74fafefc2c4","index.html":"a89212809ec39a7ee7f00c1e8b580c1c799eb49a740be62ed32aaa86063fda2b","install_models.py":"ce303878d58ca8c112cfe5fdff2c25601431572919236a94837636e5f1332a3e","launcher.bat":"50a0a75f3493e166a6707091e8a87b2cfdb9ae9848ce3c322859ce52c8f54fad","launcher.py":"11efa05d103a829f6a50b8f58b3d24b754fe58e1e3780bc16a6d5a6ef8dc4866","model_catalog.py":"b8abc0f488f90c19f21291169d33e68c64b682d23d40d2e061450d0055970b14","nodes.lock.json":"3885bf662935d362b30a4e3ec54b774cafefd951700ad1a1b51a3956962de143","requirements-app.txt":"c0ee2c01270411fcd5c8bf8e78d080237c4d1c61ae34d197c935d29cf50a8833","runtime_init.py":"6e8676fc8120de6c82623c5c3503b9dc84fbac79528285e232ea0e9d1e157452","tests/test_app_engine.py":"184782fefc642e96da250d5f548e8884fb80f96729b6989393bb0737fd0355a3","tests/test_build_nodes.py":"d8e9e71fd4b4ad588c74a91445f363bc40d672d9c32586c3e48219b4a1301249","tests/test_character_api.py":"e81ea034263171f44b48081273871fb4efbf458d8d78cf4f5c6f5b902201a76a","tests/test_character_library.py":"b20518b87c80450de882a67e1dce759792162871d45a88571ad8b83aa4f4dad0","tests/test_character_scene.py":"21454a71b4bac183424ea4d7d3e60002dc43a597b77594a84651b7661bd87952","tests/test_character_ui.cjs":"cf61dd90e4e89021b3b04ab1a2109a5b16fbceee5e7f05e408a1580600bf7087","tests/test_install_models.py":"b2931db4750531e6d8c7a2b7a469c84f7911584c55305621751d40e8ec0e82d6","tests/test_launcher.py":"646b7473dc7c4b82e8a0f4fb8a6e580706ea822f95db12830398f7bc0163280a","tests/test_proxy_origin.py":"3476dd9fdb509cfa39542570ce6ab10adc796431aab8999790de3ece70881dff","tests/test_reference_api.py":"0f8163b4f552a4dae178ca07eae51d9714480200ba9322963faf03c6a362bda3","tests/test_reference_design.py":"072961f4c40e7af965e4c50a8d7c4f59f5082f8fd587c3a130e6ce6019c9a0db","tests/test_reference_ui.cjs":"1d3761d450abe74e2f646df83731cafd0b157aebe93f5d0d3674ed0441b5611b","tests/test_reference_upload.py":"7f3ad7fb02b5f4981929030f8e4e99a2a4d7785712a5e3fa9a212278436d8283","tests/test_runtime_init.py":"f07a467108c5319ac9df74a4091da906023cebf401e9496a48f0c1f39ffef24f","tests/test_ui.cjs":"e7d3a890aad0225e4a56334785ec5e4007d22128ee831676ebbf6f501f1cfcd7","torch-constraints.txt":"442d7dddd3e1aa1d51b222dd0d9aa4ded4d1cb4c6ba133891479e07bf48d1806"}')
          assert set(files)==set(expected)
          root=Path('reviewed-source')
          for name,text in files.items():
              p=PurePosixPath(name)
              assert not p.is_absolute() and all(part not in ('','.','..') for part in name.split('/'))
              assert '\\' not in name and ':' not in name and '.private.' not in name
              assert hashlib.sha256(text.encode()).hexdigest()==expected[name], name
              target=root/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(text,encoding='utf-8',newline='\n')
          runtime=['app.py', 'core.py', 'engine.py', 'index.html']
          context=Path('image-context')
          context.mkdir()
          for name in runtime:
              (context/name).write_bytes((root/name).read_bytes())
          (context/'Dockerfile').write_text('FROM ghcr.io/itmethx-bot/motion-studio-image@sha256:0c2d7b7d7729afd70983efd855ee68765a5c2d5003ec568c70522b8879871f9a\nWORKDIR /opt/image-studio\nCOPY '+' '.join(runtime)+' /opt/image-studio/\nRUN python -m compileall -q /opt/image-studio\n',encoding='utf-8')
          print('Reviewed source hashes verified; no credentials, pictures or model weights included')
          PYCODE
      - name: Test browser logic offline
        run: |
          set -euo pipefail
          node reviewed-source/tests/test_ui.cjs
          node reviewed-source/tests/test_reference_ui.cjs
          if [ -f reviewed-source/tests/test_character_ui.cjs ]; then node reviewed-source/tests/test_character_ui.cjs; fi
      - name: Build from working immutable Image Studio image
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/motion-studio-image"
          VERSION="character-reference-${GITHUB_RUN_NUMBER}"
          docker build --platform linux/amd64 --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" --file image-context/Dockerfile --tag "$IMAGE:$VERSION" image-context
          printf 'IMAGE=%s\nVERSION=%s\n' "$IMAGE" "$VERSION" >> "$GITHUB_ENV"
      - name: Verify packaged application and run offline Linux tests
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python "$IMAGE:$VERSION" -B -c 'import hashlib,json,pathlib; expected={"app.py":"103db068920f33852ce66ec66210288bf801ffb346f98991dcf95c85687c09a3","core.py":"378b18fdd5d42559746715492218966898c7c0e44ff76861bc1e435d522e0873","engine.py":"210f41645ab74569504f3c20b4191beebb175511812b1975c0460ff78a42f7c3","index.html":"a89212809ec39a7ee7f00c1e8b580c1c799eb49a740be62ed32aaa86063fda2b"}; assert all(hashlib.sha256((pathlib.Path("/opt/image-studio")/n).read_bytes()).hexdigest()==h for n,h in expected.items()); assert hashlib.sha256(pathlib.Path("/opt/image-studio/install_models.py").read_bytes()).hexdigest()=="ce303878d58ca8c112cfe5fdff2c25601431572919236a94837636e5f1332a3e"; print("Runtime source and existing installer hashes verified")'
          docker run --rm --entrypoint python --mount "type=bind,source=$PWD/reviewed-source,target=/test-source,readonly" --workdir /test-source "$IMAGE:$VERSION" -B -c 'import sys,unittest; suite=unittest.defaultTestLoader.discover("tests",pattern="test_*.py"); assert suite.countTestCases()==173; sys.exit(0 if unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful() else 1)'
      - name: Publish separate Character Studio image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          REFERENCE="$(docker image inspect "$IMAGE:$VERSION" --format '{{index .RepoDigests 0}}')"
          [[ "$REFERENCE" =~ ^ghcr.io/.+@sha256:[a-f0-9]{64}$ ]]
          printf '## Image Studio: reference image character design\n\n`%s`\n\n173 offline Linux tests and browser regression checks passed. Existing dependencies and installer retained. Contains no model weights or private user data. GPU character inference remains unverified; no RunPod resources created by this workflow.\n' "$REFERENCE" >> "$GITHUB_STEP_SUMMARY"
