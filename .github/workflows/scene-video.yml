name: Build Image Studio Scene Video
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-studio-scene-video-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'itmethx-bot/motion-studio-image' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout public image repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Free disposable hosted runner space for CUDA image
        run: |
          set -euo pipefail
          [[ "$RUNNER_OS" == 'Linux' && "$GITHUB_ACTIONS" == 'true' ]]
          df -h /
          # ลบเฉพาะ SDK ที่ไม่ใช้บน Ubuntu Actions ชั่วคราว ไม่รันคำสั่งนี้บน PC ผู้ใช้
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Restore reviewed byte-exact source and verify allowlist
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64,gzip,hashlib,json
          from pathlib import Path,PurePosixPath
          compressed=base64.b64decode('',validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='27608287c5a22c0ce99c971b5bbf714d710d043eb057ee95da66b24212999b8a'
          envelope=json.loads(gzip.decompress(compressed))
          manifest=json.loads(base64.b64decode('',validate=True))
          files=envelope['files']
          assert envelope['version']==1 and set(files)==set(manifest['files'])
          assert len(files)==41
          root=Path('reviewed-source')
          root.mkdir(exist_ok=False)
          for name,encoded in files.items():
              p=PurePosixPath(name)
              assert not p.is_absolute() and all(part not in ('','.','..') for part in name.split('/'))
              assert '\\' not in name and ':' not in name and '.private.' not in name
              assert p.name not in ('config.env','state.json')
              assert p.suffix!='.env' or p.name=='config.example.env'
              raw=base64.b64decode(encoded,validate=True)
              assert len(raw)==manifest['files'][name]['bytes']
              assert hashlib.sha256(raw).hexdigest()==manifest['files'][name]['sha256'],name
              raw.decode('utf-8')
              target=root/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(raw)
          context=Path('image-context')
          context.mkdir(exist_ok=False)
          for name in manifest['overlay_runtime']:
              (context/name).write_bytes((root/name).read_bytes())
          dockerfile=base64.b64decode('',validate=True)
          assert hashlib.sha256(dockerfile).hexdigest()=='35e9bc1e162130615fd3c655eb9efcfaeddeffe5e3791ae4c8749f3e01dc6c99'
          (context/'Dockerfile').write_bytes(dockerfile)
          Path('payload-manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          print('Verified every source byte; no model weights, real credentials, private pictures or state files included')
          PYCODE
      - name: Test four browser suites offline
        run: |
          set -euo pipefail
          node --version
          node reviewed-source/tests/test_ui.cjs
          node reviewed-source/tests/test_character_ui.cjs
          node reviewed-source/tests/test_reference_ui.cjs
          node reviewed-source/tests/test_video_ui.cjs
      - name: Login to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build additive image from verified immutable base
        run: |
          set -euo pipefail
          IMAGE='ghcr.io/itmethx-bot/motion-studio-image'
          VERSION="scene-video-${GITHUB_RUN_NUMBER}"
          docker build --platform linux/amd64 --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" --file image-context/Dockerfile --tag "$IMAGE:$VERSION" image-context
          printf 'IMAGE=%s\nVERSION=%s\n' "$IMAGE" "$VERSION" >> "$GITHUB_ENV"
      - name: Verify packaged runtime, dependency health and media tools
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint python "$IMAGE:$VERSION" -B -m pip check
          docker run --rm --network none --entrypoint python "$IMAGE:$VERSION" -B -c 'import hashlib,pathlib,shutil; expected={"app.py":"6d59a9592714b0252141770e590e21b424583c44418559000343ad6229403a8b","engine.py":"4dec1dce423abea5a325a25090d40708722ce104429f95da975f75851c490600","index.html":"331e9dfca06b37fb4170673908a3f7b203a6797716d58a8ea8cad9035099e93a","model_catalog.py":"3f12733244cab10bd341a00156af1cfd0774243497892f406e05b701e00de09b","video_core.py":"e6e8fa1cc895384665d150d1cf983ee696ab9ef70ebc60328d5021cd02731fba","video_engine.py":"d16065f2303495e31a7f089b9ef9113131c0cea64360955e21e96c0a6efe5f6b","core.py":"378b18fdd5d42559746715492218966898c7c0e44ff76861bc1e435d522e0873","install_models.py":"ce303878d58ca8c112cfe5fdff2c25601431572919236a94837636e5f1332a3e","runtime_init.py":"6e8676fc8120de6c82623c5c3503b9dc84fbac79528285e232ea0e9d1e157452","entrypoint.sh":"9d22eeccee7ce6a7b7baf1131f420f0293cbc995d1f3aafad29eb6a8d76b0f4c","extra_model_paths.yaml":"6319df78e29c3c09b99a035cd78fe09a0c8fc5a344fea8782cbce74fafefc2c4"}; root=pathlib.Path("/opt/image-studio"); assert all(hashlib.sha256((root/n).read_bytes()).hexdigest()==h for n,h in expected.items()); assert shutil.which("ffmpeg") and shutil.which("ffprobe"); print("Overlay and retained runtime source hashes and real CPU media tools verified")'
          docker image inspect "$IMAGE:$VERSION" --format '{{json .Config.Env}}' > image-env.json
          python3 - <<'PYCODE'
          import json
          env=dict(value.split('=',1) for value in json.load(open('image-env.json')) if '=' in value)
          assert env['MODEL_GROUPS']=='sdxl,character,pose,segmentation,video'
          assert env['BOOTSTRAP_MODELS']=='0'
          assert not any(env.get(name) for name in ('APP_ACCESS_CODE','IMAGE_STUDIO_ACCESS_CODE','IMAGE_STUDIO_CODE','RUNPOD_API_KEY','HF_TOKEN'))
          PYCODE
      - name: Run complete offline Linux Python tests without GPU or Internet
        run: |
          set -euo pipefail
          docker run --rm --network none --env PYTHONDONTWRITEBYTECODE=1 --entrypoint python --mount "type=bind,source=$PWD/reviewed-source,target=/test-source,readonly" --workdir /test-source "$IMAGE:$VERSION" -B -c 'import sys,unittest; suite=unittest.defaultTestLoader.discover("tests",pattern="test_*.py"); assert suite.countTestCases()==216; result=unittest.TextTestRunner(verbosity=2).run(suite); assert not result.skipped, result.skipped; sys.exit(0 if result.wasSuccessful() else 1)'
      - name: Publish separate Scene Video tag after all tests pass
        run: |
          set -euo pipefail
          docker push "$IMAGE:$VERSION"
          REFERENCE="$(docker image inspect "$IMAGE:$VERSION" --format '{{index .RepoDigests 0}}')"
          [[ "$REFERENCE" =~ ^ghcr.io/itmethx-bot/motion-studio-image@sha256:[a-f0-9]{64}$ ]]
          printf '%s\n' "$REFERENCE" > image-reference.txt
          printf '## Image Studio: scene images to video\n\n`%s`\n\n216 offline Linux Python tests and four browser suites passed. A real CPU H.264 MP4 was generated and fully decoded by the media validator. Six runtime files were overlaid on the verified Character Reference image; no model weights or real user credentials are included. BOOTSTRAP_MODELS remains 0.\n\nActual Wan GPU inference and visual quality remain unverified. This workflow does not create or modify RunPod resources.\n' "$REFERENCE" >> "$GITHUB_STEP_SUMMARY"
      - name: Logout registry
        if: always()
        run: docker logout ghcr.io >/dev/null 2>&1 || true
