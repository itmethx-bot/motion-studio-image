          docker run --rm --entrypoint python "$IMAGE:$VERSION" -B -c 'import hashlib,pathlib; assert hashlib.sha256(pathlib.Path("/opt/image-studio/install_models.py").read_bytes()).hexdigest()=="ce303878d58ca8c112cfe5fdff2c25601431572919236a94837636e5f1332a3e"; assert hashlib.sha256(pathlib.Path("/opt/image-studio/app.py").read_bytes()).hexdigest()=="a18aa11e1c90987533d99094d431b8460eb1b44a2f26ee182860456185a55b89"; print("Image app and installer SHA256 verified")'
          docker run --rm --entrypoint python \
            --mount "type=bind,source=$PWD/repair-src,target=/test-source,readonly" \
            --workdir /test-source "$IMAGE:$VERSION" -B -c 'import sys,unittest; suite=unittest.defaultTestLoader.discover("tests",pattern="test_*.py"); assert suite.countTestCases()==103, "Expected 103 offline tests"; sys.exit(0 if unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful() else 1)'
      - name: Probe all 36 starter downloads with HEAD only
        run: |
          set -euo pipefail
          docker run --rm -i --entrypoint python --workdir /opt/image-studio "$IMAGE:$VERSION" -B - <<'PYCODE'
          from concurrent.futures import ThreadPoolExecutor
          from urllib.parse import urlsplit
          import requests
          import install_models
          from model_catalog import select_models
          entries=select_models(['sdxl','character','pose','segmentation'])
          assert len(entries)==36
          def probe(entry):
              # ตรวจเฉพาะ header ไม่โหลด weight และไม่อ่าน/ส่ง HF token
              with requests.Session() as session:
                  session.trust_env=False
                  try:
                      response=install_models.http_stream(session,entry['url'],token=None,method='HEAD')
                      try:
                          status=response.status_code
                          hostname=urlsplit(response.url).hostname
                          print(entry['id'],status,hostname,flush=True)
                          return status in (200,206)
                      finally:
                          response.close()
                  except Exception as exc:
                      # ห้ามพิมพ์ signed URL/query หรือ credentials ลง log
                      print(entry['id'],'ERROR',type(exc).__name__,flush=True)
                      return False
          with ThreadPoolExecutor(max_workers=4) as pool:
              successful=list(pool.map(probe,entries))
          assert all(successful), 'One or more starter HEAD probes failed; image will not be published'
          PYCODE
      - name: Publish separately tagged repair image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          REFERENCE="$(docker image inspect "$IMAGE:$VERSION" --format '{{index .RepoDigests 0}}')"
          [[ "$REFERENCE" =~ ^ghcr.io/.+@sha256:[a-f0-9]{64}$ ]]
          printf '## Original Text-to-Image proxy login repair\n\n`%s`\n\nImmutable CDN-repaired image plus only the reviewed trusted proxy-origin login fix. CSRF remains enforced. All 103 offline Linux tests and 36 public HEAD probes passed. No model bodies downloaded by probes; no RunPod resources created. GPU inference remains unverified.\n' "$REFERENCE" >> "$GITHUB_STEP_SUMMARY"
