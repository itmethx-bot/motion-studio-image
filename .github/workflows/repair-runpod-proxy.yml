      - name: Build minimal repair layer from immutable image
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="runpod-original-proxy-${GITHUB_SHA}"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --file repair-context/Dockerfile.repair --tag "$IMAGE:$VERSION" repair-context
          printf 'IMAGE=%s\nVERSION=%s\n' "$IMAGE" "$VERSION" >> "$GITHUB_ENV"
