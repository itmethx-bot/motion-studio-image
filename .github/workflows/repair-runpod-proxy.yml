name: Repair RunPod Original Proxy Login
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-studio-runpod-original
  cancel-in-progress: false
jobs:
  repair:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify original archive and prepare reviewed repair source
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib,json,re,stat,zipfile
          from pathlib import Path,PurePosixPath
          archive_path=Path('image-studio-runpod-original-source.zip')
          assert hashlib.sha256(archive_path.read_bytes()).hexdigest()=='b63f1a69be14fca38939ead6f5528a2be3ae9a1e6a4800a1f04cc6d0b79a5baa', 'Original archive SHA256 mismatch'
          expected_paths=set(json.loads(r'''[".dockerignore", ".gitignore", "Dockerfile", "app.py", "build_nodes.py", "character-requirements.txt", "config.example.env", "core.py", "engine.py", "entrypoint.sh", "extra_model_paths.yaml", "index.html", "install_models.py", "launcher.bat", "launcher.py", "model_catalog.py", "nodes.lock.json", "requirements-app.txt", "runtime_init.py", "tests/test_app_engine.py", "tests/test_install_models.py", "tests/test_launcher.py", "tests/test_runtime_init.py", "tests/test_ui.cjs", "torch-constraints.txt"]'''))
          protected=json.loads(r'''{"app.py": "ed2103d6cba02e3518a5036ac11d588067f819ae64cffe331b7d1a42b4e9b28f", "core.py": "a97edd93eb3c26711598b0c2601456a38112a69825f46dda00dd5d515aa9fd86", "engine.py": "c6b973854f347933eee90131d78830527c963990b8286299b5ec1f9150c3d8e1", "index.html": "3016e62caf5cad6e19c4b73553a00d00a06201a4272fbdb055e6b1025d061215"}''')
          with zipfile.ZipFile(archive_path) as archive:
              names=archive.namelist()
              assert len(names)==len(set(names)), 'Duplicate archive paths'
              manifest=json.loads(archive.read('payload-manifest.json'))
              assert isinstance(manifest,dict) and set(manifest)==expected_paths, 'Original payload manifest paths changed'
              assert set(names)=={'source/'+name for name in manifest}|{'payload-manifest.json'}, 'Unexpected/missing archive payload'
              for name,checksum in manifest.items():
                  relative=PurePosixPath(name)
                  assert isinstance(name,str) and name and not relative.is_absolute() and not any(p in ('','.','..') for p in name.split('/'))
                  assert '\\' not in name and ':' not in name and '\x00' not in name
                  assert re.fullmatch(r'[a-f0-9]{64}',checksum)
                  assert name not in ('config.env','state.json') and '.private.' not in name
                  info=archive.getinfo('source/'+name)
                  assert not info.is_dir() and not stat.S_ISLNK(info.external_attr>>16) and not info.flag_bits&1
                  assert 0 < info.file_size < 2*1024**2
                  assert hashlib.sha256(archive.read(info)).hexdigest()==checksum, 'Payload SHA256 mismatch: '+name
              for name,checksum in protected.items():
                  assert manifest[name]==checksum, 'Original app manifest mismatch: '+name
              archive.extractall('repair-build')
          root=Path('repair-build/source')
          # คง packaging fix ที่ผ่าน Linux tests แล้ว โดยไม่ rebuild dependency
          files=json.loads(r'''{"Dockerfile": "# ไม่มีโมเดลหรือ API key ใน image; โมเดลอยู่บน Network Volume เท่านั้น\nARG BASE_IMAGE=nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04@sha256:ad6d59a3bbf3e82c1c849c9ac09cfc2a3e0bbb8655042fd899be6681b3fe2a85\nFROM ${BASE_IMAGE}\nUSER root\nENV DEBIAN_FRONTEND=noninteractive PYTHONUNBUFFERED=1 PYTHONUTF8=1 PIP_NO_CACHE_DIR=1 \\\n    PATH=/opt/venv/bin:$PATH MODELS_ROOT=/workspace/models \\\n    DATA_ROOT=/workspace/image-studio-data APP_PORT=5000 COMFY_PORT=8188 \\\n    COMFY_INTERNAL_PORT=8189 BOOTSTRAP_MODELS=0 \\\n    MODEL_GROUPS=sdxl,character,pose,segmentation \\\n    HF_HUB_DISABLE_TELEMETRY=1 DO_NOT_TRACK=1\nRUN apt-get update && apt-get install -y --no-install-recommends \\\n    python3 python3-venv python3-dev build-essential git ca-certificates \\\n    libgl1 libglib2.0-0 libgomp1 ffmpeg nginx openssl tini \\\n    && rm -rf /var/lib/apt/lists/* \\\n    && python3 -m venv /opt/venv\nCOPY torch-constraints.txt build-constraints.txt character-requirements.txt requirements-app.txt /opt/build/\nRUN python -m pip install --upgrade pip \\\n    && python -m pip install --index-url https://download.pytorch.org/whl/cu128 \\\n       -r /opt/build/torch-constraints.txt\nCOPY nodes.lock.json build_nodes.py /opt/build/\nRUN python /opt/build/build_nodes.py --root /opt/ComfyUI --lock /opt/build/nodes.lock.json \\\n    --constraints /opt/build/build-constraints.txt \\\n    && python -m pip install -c /opt/build/build-constraints.txt \\\n       -r /opt/build/character-requirements.txt -r /opt/build/requirements-app.txt \\\n    && python -m pip check\nWORKDIR /opt/image-studio\n# COPY ระบุไฟล์ชัดเจน ป้องกัน config.env/state/ภาพส่วนตัวติดเข้า container\nCOPY app.py core.py engine.py index.html install_models.py model_catalog.py \\\n     runtime_init.py entrypoint.sh extra_model_paths.yaml /opt/image-studio/\nRUN python -m compileall -q /opt/image-studio \\\n    && chmod 755 /opt/image-studio/entrypoint.sh\nEXPOSE 5000 8188\nHEALTHCHECK --interval=20s --timeout=5s --start-period=10m --retries=3 \\\n    CMD python -c \"import json,os,urllib.request; u='http://127.0.0.1:'+os.getenv('APP_PORT','5000')+'/healthz'; r=json.load(urllib.request.build_opener(urllib.request.ProxyHandler({})).open(u,timeout=4)); assert r.get('ready') is True\"\nENTRYPOINT [\"/usr/bin/tini\",\"--\",\"/opt/image-studio/entrypoint.sh\"]\nCMD []\n", "build_nodes.py": "\"\"\"Install pinned code/dependencies during Docker build; never fetch model weights.\"\"\"\nimport argparse\nimport json\nfrom pathlib import Path\nimport re\nimport subprocess\nimport sys\n\n\ndef clone(entry, path):\n    if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', entry['repo']):\n        raise ValueError('ชื่อ repository ไม่ถูกต้อง')\n    if not re.fullmatch(r'[a-f0-9]{40}', entry['commit']):\n        raise ValueError('ต้องระบุ commit เต็มเพื่อทำซ้ำได้')\n    # ใช้ source จากเจ้าของโครงการ ไม่รัน install.py ที่อาจดึงโมเดลระหว่าง build\n    subprocess.run(['git', 'init', str(path)], check=True)\n    subprocess.run(['git', '-C', str(path), 'remote', 'add', 'origin', 'https://github.com/' + entry['repo'] + '.git'], check=True)\n    subprocess.run(['git', '-C', str(path), 'fetch', '--depth', '1', 'origin', entry['commit']], check=True)\n    subprocess.run(['git', '-C', str(path), 'checkout', '--detach', 'FETCH_HEAD'], check=True)\n    actual = subprocess.check_output(['git', '-C', str(path), 'rev-parse', 'HEAD'], text=True).strip()\n    if actual != entry['commit']:\n        raise ValueError('commit ที่ติดตั้งไม่ตรงกับ lock')\n\n\ndef install_requirements(path, constraints):\n    requirements = path / 'requirements.txt'\n    if requirements.is_file():\n        # สองแพ็กเกจนี้ใช้ namespace เดียวกัน จึงติดตั้งเฉพาะรุ่นเดิมที่เข้ากันได้\n        lines = requirements.read_text(encoding='utf-8').splitlines()\n        normalized = [\n            'albumentations==2.0.8' if line.strip() == 'albumentationsx' else line\n            for line in lines\n        ]\n        if normalized != lines:\n            requirements = path / 'requirements.image-studio.txt'\n            requirements.write_text('\\n'.join(normalized) + '\\n', encoding='utf-8')\n            print('Packaging compatibility: albumentationsx -> albumentations==2.0.8', flush=True)\n        subprocess.run([sys.executable, '-m', 'pip', 'install', '-c', str(constraints), '-r', str(requirements)], check=True)\n\n\ndef main():\n    p = argparse.ArgumentParser()\n    p.add_argument('--root', type=Path, required=True)\n    p.add_argument('--lock', type=Path, required=True)\n    p.add_argument('--constraints', type=Path, required=True)\n    args = p.parse_args()\n    lock = json.loads(args.lock.read_text(encoding='utf-8'))\n    clone(lock['comfy'], args.root)\n    install_requirements(args.root, args.constraints)\n    for entry in lock['nodes']:\n        if not re.fullmatch(r'[A-Za-z0-9_.-]+', entry['directory']):\n            raise ValueError('ชื่อโฟลเดอร์ node ไม่ถูกต้อง')\n        path = args.root / 'custom_nodes' / entry['directory']\n        clone(entry, path)\n        install_requirements(path, args.constraints)\n    # ย้ายเพียงโครง placeholder ที่มากับ Git ภายใน image ไม่แตะ Network Volume\n    models = args.root / 'models'\n    if models.exists():\n        for file in models.rglob('*'):\n            if file.is_file() and file.suffix.lower() in ('.safetensors', '.ckpt', '.pt', '.pth', '.onnx', '.bin'):\n                raise ValueError('พบโมเดลใน source ระหว่าง build จึงหยุดก่อนแพ็ก image')\n        models.rename(args.root / 'model-path-reference')\n\n\nif __name__ == '__main__':\n    main()\n", "build-constraints.txt": "# จำกัดเฉพาะตอนติดตั้ง ไม่เปลี่ยน workflow หรือโมเดลของแอป\n-c torch-constraints.txt\nalbumentations==2.0.8\nalbucore==0.0.24\n\n# Manager ต้องใช้ chardet รุ่นที่ Requests เดิมรองรับ\nchardet==5.2.0\n", "tests/test_build_nodes.py": "\"\"\"ตรวจการแก้ dependency โดยไม่รัน pip หรือเปลี่ยน source ของส่วนเสริม\"\"\"\nimport tempfile\nimport unittest\nfrom pathlib import Path\nfrom unittest.mock import patch\n\nimport build_nodes\n\n\nclass BuildRequirementsTest(unittest.TestCase):\n    def test_aux_namespace_collision_is_normalized(self):\n        with tempfile.TemporaryDirectory() as folder:\n            root = Path(folder)\n            original = 'torch\\nalbumentationsx\\n# keep comment\\n'\n            (root / 'requirements.txt').write_text(original, encoding='utf-8')\n            with patch('build_nodes.subprocess.run') as run:\n                build_nodes.install_requirements(root, root / 'constraints.txt')\n            generated = root / 'requirements.image-studio.txt'\n            self.assertEqual(generated.read_text(encoding='utf-8'), 'torch\\nalbumentations==2.0.8\\n# keep comment\\n')\n            self.assertEqual((root / 'requirements.txt').read_text(encoding='utf-8'), original)\n            self.assertEqual(run.call_args.args[0][-1], str(generated))\n            self.assertTrue(run.call_args.kwargs['check'])\n\n    def test_other_requirements_are_passed_through(self):\n        with tempfile.TemporaryDirectory() as folder:\n            root = Path(folder)\n            original = 'albumentations>=1.4.16\\nrequests\\n'\n            (root / 'requirements.txt').write_text(original, encoding='utf-8')\n            with patch('build_nodes.subprocess.run') as run:\n                build_nodes.install_requirements(root, root / 'constraints.txt')\n            self.assertEqual(run.call_args.args[0][-1], str(root / 'requirements.txt'))\n            self.assertFalse((root / 'requirements.image-studio.txt').exists())\n\n\nif __name__ == '__main__':\n    unittest.main()\n"}''')
          assert set(files)=={'Dockerfile','build_nodes.py','build-constraints.txt','tests/test_build_nodes.py'}
          for name,text in files.items():
              (root/name).write_text(text,encoding='utf-8',newline='\n')
          patch=json.loads(r'''{"old_tail": "    'cas-bridge.xethub.hf.co', 'cdn-lfs.hf.co'}\n", "new_tail": "    'cas-bridge.xethub.hf.co', 'cdn-lfs.hf.co',\n    # CDN ทางการรุ่นใหม่: อนุญาตเฉพาะ redirect และยังตรวจ SHA256 ทุกไฟล์\n    'us.aws.cdn.hf.co', 'us.gcp.cdn.hf.co'}\n", "installer_sha256": "ce303878d58ca8c112cfe5fdff2c25601431572919236a94837636e5f1332a3e", "tests_anchor": "    def test_unapproved_host_and_credentials_blocked(self):\n", "new_tests": "    def test_current_hf_cdn_redirect_does_not_receive_token(self):\n        # รองรับ CDN ปัจจุบันโดยไม่ส่ง token ข้าม host\n        for host in ('us.aws.cdn.hf.co', 'us.gcp.cdn.hf.co'):\n            with self.subTest(host=host):\n                redirect = Response(status=302, headers={'Location': 'https://' + host + '/model?signature=private'})\n                final = Response()\n                session = Session(redirect, final)\n                self.assertIs(installer.http_stream(session, URL, token='private-token'), final)\n                final.close()\n                self.assertTrue(redirect.closed)\n                self.assertEqual(session.calls[0][2]['headers']['Authorization'], 'Bearer private-token')\n                self.assertNotIn('Authorization', session.calls[1][2]['headers'])\n                self.assertNotIn('signature=private', self.output.getvalue() + self.errors.getvalue())\n\n    def test_current_hf_cdn_not_allowed_as_initial_publisher(self):\n        for host in ('us.aws.cdn.hf.co', 'us.gcp.cdn.hf.co'):\n            session = Session()\n            with self.assertRaises(installer.InstallError):\n                installer.http_stream(session, 'https://' + host + '/model')\n            self.assertEqual(session.calls, [])\n\n    def test_current_hf_cdn_deceptive_redirects_blocked(self):\n        for url in ('http://us.aws.cdn.hf.co/model', 'https://us.aws.cdn.hf.co:80/model',\n                    'https://us.aws.cdn.hf.co.evil.example/model',\n                    'https://us.aws.cdn.hf.co@evil.example/model',\n                    'https://user:password@us.aws.cdn.hf.co/model'):\n            with self.subTest(url=url):\n                redirect = Response(status=302, headers={'Location': url})\n                session = Session(redirect)\n                with self.assertRaises(installer.InstallError):\n                    installer.http_stream(session, URL)\n                self.assertTrue(redirect.closed)\n                self.assertEqual(len(session.calls), 1)\n\n    def test_current_hf_cdn_still_checks_download_hash(self):\n        responses = []\n        for _ in range(3):\n            responses += [Response(status=302, headers={'Location': 'https://us.aws.cdn.hf.co/model'}),\n                          Response(b'badbad')]\n        item = entry()\n        session = Session(*responses)\n        self.assertEqual(self.install([item], session)['sample'], 'failed')\n        self.assertFalse(self.target(item).exists())\n        self.assertEqual(len(session.calls), 6)\n\n    def test_hf_cdn_multihop_never_receives_token(self):\n        session = Session(Response(status=302, headers={'Location': 'https://cas-bridge.xethub.hf.co/model'}),\n                          Response(status=307, headers={'Location': 'https://us.aws.cdn.hf.co/model'}), Response())\n        installer.http_stream(session, URL, token='private-token').close()\n        for _, _, kwargs in session.calls[1:]:\n            self.assertNotIn('Authorization', kwargs['headers'])\n\n", "tests_sha256": "b2931db4750531e6d8c7a2b7a469c84f7911584c55305621751d40e8ec0e82d6"}''')
          installer=root/'install_models.py'
          original=installer.read_text(encoding='utf-8')
          assert original.count(patch['old_tail'])==1 and patch['new_tail'] not in original, 'Installer patch anchor mismatch'
          installer.write_text(original.replace(patch['old_tail'],patch['new_tail'],1),encoding='utf-8',newline='\n')
          assert hashlib.sha256(installer.read_bytes()).hexdigest()==patch['installer_sha256'], 'Repaired installer differs from reviewed source'
          test_file=root/'tests/test_install_models.py'
          original=test_file.read_text(encoding='utf-8')
          assert original.count(patch['tests_anchor'])==1
          assert 'def test_current_hf_cdn_redirect_does_not_receive_token' not in original, 'CDN regression tests already present'
          assert patch['new_tests'].count('    def test_')==5
          test_file.write_text(original.replace(patch['tests_anchor'],patch['new_tests']+patch['tests_anchor'],1),encoding='utf-8',newline='\n')
          assert hashlib.sha256(test_file.read_bytes()).hexdigest()==patch['tests_sha256'], 'Regression tests differ from reviewed source'
          for name,checksum in protected.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==checksum, 'Original application changed: '+name
          # แก้เฉพาะ origin ที่เชื่อถือได้จาก env ของ Pod โดยไม่ปิด CSRF
          proxy_files=json.loads(r'''{"app.py": "\"\"\"หน้า Text-to-Image บน RunPod; ใช้ Python มาตรฐาน + requests เท่านั้น\"\"\"\nfrom __future__ import annotations\n\nfrom http.cookies import SimpleCookie\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport secrets\nimport threading\nimport time\nfrom urllib.parse import urlsplit\n\nfrom engine import Engine, EngineError, JOB_ID\n\nROOT = Path(__file__).resolve().parent\nMAX_BODY = 16 * 1024\n\n\ndef canonical_origin(value):\n    \"\"\"ตรวจ origin ให้เหลือ scheme/host/port โดยไม่ยอมรับ URL ที่มีข้อมูลแฝง\"\"\"\n    if (not isinstance(value, str) or not value or len(value) > 2048\n            or re.search(r\"[\\s,\\x00-\\x1f\\x7f]\", value) or \"?\" in value or \"#\" in value):\n        raise ValueError(\"รูปแบบ origin ไม่ถูกต้อง\")\n    parsed = urlsplit(value)\n    if (parsed.scheme not in (\"https\", \"http\") or not parsed.hostname\n            or parsed.username is not None or parsed.password is not None\n            or parsed.path not in (\"\", \"/\") or parsed.netloc.endswith(\":\")):\n        raise ValueError(\"origin ต้องมีเฉพาะ scheme, hostname และ port\")\n    port = parsed.port\n    hostname = parsed.hostname.lower()\n    if \":\" in hostname:\n        hostname = \"[\" + hostname + \"]\"\n    if port is not None and port != (443 if parsed.scheme == \"https\" else 80):\n        hostname += \":\" + str(port)\n    return parsed.scheme + \"://\" + hostname\n\n\ndef public_origin_from_env(app_port):\n    if type(app_port) is not int or not 1024 <= app_port <= 65535:\n        raise ValueError(\"APP_PORT ต้องเป็นพอร์ต 1024–65535\")\n    configured = os.environ.get(\"IMAGE_STUDIO_PUBLIC_ORIGIN\", \"\")\n    if configured:\n        origin = canonical_origin(configured)\n        if not origin.startswith(\"https://\"):\n            raise ValueError(\"IMAGE_STUDIO_PUBLIC_ORIGIN ต้องใช้ HTTPS\")\n        return origin\n    pod_id = os.environ.get(\"RUNPOD_POD_ID\", \"\")\n    if not pod_id:\n        return None\n    if not re.fullmatch(r\"[a-z0-9]{6,64}\", pod_id):\n        raise ValueError(\"RUNPOD_POD_ID ไม่ถูกต้อง\")\n    # ใช้ Pod ID ที่ระบบกำหนดให้ ไม่เชื่อ Host/Forwarded ที่ผู้ส่งปลอมได้\n    return \"https://\" + pod_id + \"-\" + str(app_port) + \".proxy.runpod.net\"\n\n\nclass Application:\n    def __init__(self, engine, code, index_path=ROOT / \"index.html\", public_origin=None):\n        if not isinstance(code, str) or not re.fullmatch(r\"[A-Za-z0-9_-]{24,128}\", code):\n            raise ValueError(\"ตั้ง IMAGE_STUDIO_CODE เป็นรหัส 24–128 ตัวอักษร (ตัวอักษร ตัวเลข _ หรือ -)\")\n        self.engine = engine\n        self.code = code\n        self.index_path = Path(index_path)\n        self.public_origin = canonical_origin(public_origin) if public_origin is not None else None\n        self.sessions = {}\n        self.attempts = {}\n        self.lock = threading.Lock()\n\n    def authenticated(self, cookie):\n        if not isinstance(cookie, str) or len(cookie) > 4096:\n            return False\n        try:\n            parsed = SimpleCookie()\n            parsed.load(cookie)\n            token = parsed.get(\"image_session\")\n            with self.lock:\n                return bool(token and self.sessions.get(token.value, 0) > time.time())\n        except Exception:\n            return False\n\n    def login(self, code, peer):\n        now = time.time()\n        with self.lock:\n            previous = [timestamp for timestamp in self.attempts.get(peer, []) if now - timestamp < 60]\n            self.attempts[peer] = previous\n            if len(previous) >= 10:\n                return None, 429\n            if not isinstance(code, str) or not secrets.compare_digest(code.encode(\"utf-8\"), self.code.encode(\"utf-8\")):\n                previous.append(now)\n                return None, 401\n            self.attempts.pop(peer, None)\n            self.sessions = {token: expiry for token, expiry in self.sessions.items() if expiry > now}\n            token = secrets.token_urlsafe(32)\n            self.sessions[token] = now + 86400\n            return token, 200\n\n    def handler(self):\n        application = self\n\n        class Handler(BaseHTTPRequestHandler):\n            server_version = \"ImageStudio\"\n\n            def log_message(self, format, *args):\n                # ไม่พิมพ์ URL/query/body/cookie ที่อาจมีรหัสหรือ prompt ลง access log\n                return\n\n            def respond(self, status, body, content_type=\"application/json; charset=utf-8\", headers=None):\n                raw = json.dumps(body, ensure_ascii=False).replace(application.code, \"[ปกปิดรหัส]\").encode(\"utf-8\") if isinstance(body, dict) else body\n                self.send_response(status)\n                self.send_header(\"Content-Type\", content_type)\n                self.send_header(\"Content-Length\", str(len(raw)))\n                self.send_header(\"Cache-Control\", \"no-store\")\n                self.send_header(\"X-Content-Type-Options\", \"nosniff\")\n                self.send_header(\"Referrer-Policy\", \"no-referrer\")\n                self.send_header(\"X-Frame-Options\", \"DENY\")\n                self.send_header(\"Content-Security-Policy\", \"default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'\")\n                for key, value in (headers or {}).items():\n                    self.send_header(key, value)\n                self.end_headers()\n                self.wfile.write(raw)\n\n            def error(self, status, message):\n                # ข้อความจาก ComfyUI อาจมีข้อมูลที่ตั้งไว้ใน environment: ลบรหัสก่อนส่ง\n                self.respond(status, {\"error\": str(message).replace(application.code, \"[ปกปิดรหัส]\")[:700]})\n\n            def protected(self):\n                if not application.authenticated(self.headers.get(\"Cookie\", \"\")):\n                    self.error(401, \"กรุณาใส่รหัสเข้าใช้งาน\")\n                    return False\n                return True\n\n            def mutation(self):\n                if self.headers.get(\"X-Requested-With\") != \"ImageStudio\":\n                    self.error(403, \"คำขอไม่ถูกต้อง กรุณาใช้หน้าแอปนี้\")\n                    return False\n                origin = self.headers.get(\"Origin\")\n                if origin:\n                    try:\n                        # RunPod อาจเขียน Host ใหม่: เทียบกับ URL ของ Pod นี้โดยตรง\n                        expected = application.public_origin or canonical_origin(\n                            urlsplit(origin).scheme + \"://\" + self.headers.get(\"Host\", \"\"))\n                        if canonical_origin(origin) != expected:\n                            raise ValueError(\"origin ไม่ตรงกัน\")\n                    except ValueError:\n                        self.error(403, \"ไม่อนุญาตคำขอจากเว็บไซต์อื่น\")\n                        return False\n                return True\n\n            def body(self):\n                if self.headers.get(\"Transfer-Encoding\"):\n                    raise ValueError(\"รูปแบบคำขอไม่รองรับ\")\n                length = self.headers.get(\"Content-Length\", \"\")\n                if not length.isdecimal() or not 0 < int(length) <= MAX_BODY:\n                    raise ValueError(\"ข้อมูลคำขอว่างหรือใหญ่เกิน 16 KB\")\n                if self.headers.get(\"Content-Type\", \"\").split(\";\", 1)[0].strip() != \"application/json\":\n                    raise ValueError(\"ข้อมูลต้องเป็น JSON\")\n                self.connection.settimeout(10)\n                raw = self.rfile.read(int(length))\n                if len(raw) != int(length):\n                    raise ValueError(\"ส่งข้อมูลมาไม่ครบ\")\n                value = json.loads(raw)\n                if not isinstance(value, dict):\n                    raise ValueError(\"ข้อมูลคำขอไม่ถูกต้อง\")\n                return value\n\n            def do_GET(self):\n                try:\n                    path = urlsplit(self.path).path\n                    if path in (\"/\", \"/image-studio/\"):\n                        self.respond(200, application.index_path.read_bytes(), \"text/html; charset=utf-8\")\n                        return\n                    if path == \"/healthz\":\n                        status = application.engine.readiness()\n                        self.respond(200 if status.get(\"ready\") else 503,\n                                     {\"ready\": bool(status.get(\"ready\")), \"service\": \"image-studio\"})\n                        return\n                    if not self.protected():\n                        return\n                    if path == \"/api/status\":\n                        self.respond(200, application.engine.status())\n                        return\n                    match = re.fullmatch(r\"/api/jobs/([a-f0-9]{32})(?:/(image|settings))?\", path)\n                    if match:\n                        job_id, output = match.groups()\n                        if not output:\n                            self.respond(200, application.engine.get_job(job_id))\n                        else:\n                            extension = \"png\" if output == \"image\" else \"json\"\n                            file = application.engine.output_path(job_id, extension)\n                            if file.stat().st_size > 30 * 1024**2:\n                                raise EngineError(\"ผลลัพธ์ใหญ่เกินขนาดที่รองรับ\")\n                            self.respond(200, file.read_bytes(), \"image/png\" if output == \"image\" else \"application/json; charset=utf-8\",\n                                         {\"Content-Disposition\": ('inline' if output == \"image\" else 'attachment') + '; filename=\"image-' + job_id[:8] + '.' + extension + '\"'})\n                        return\n                    self.error(404, \"ไม่พบหน้านี้\")\n                except (BrokenPipeError, ConnectionResetError):\n                    return\n                except (ValueError, OSError):\n                    self.error(400, \"อ่านสถานะหรือไฟล์ผลลัพธ์ไม่ได้ กรุณาตรวจงานเดิม\")\n                except Exception:\n                    self.error(500, \"ระบบอ่านผลลัพธ์ไม่สำเร็จ กรุณาตรวจ Logs ของ Pod\")\n\n            def do_POST(self):\n                try:\n                    if not self.mutation():\n                        return\n                    path = urlsplit(self.path).path\n                    if path == \"/api/login\":\n                        body = self.body()\n                        token, status = application.login(body.get(\"code\"), self.client_address[0])\n                        if not token:\n                            self.error(status, \"รอ 1 นาทีแล้วลองใหม่\" if status == 429 else \"รหัสไม่ถูกต้อง\")\n                            return\n                        cookie = \"image_session=\" + token + \"; Path=/; HttpOnly; SameSite=Strict; Max-Age=86400\"\n                        if ((application.public_origin or \"\").startswith(\"https://\")\n                                or self.headers.get(\"X-Forwarded-Proto\", \"\").lower() == \"https\"):\n                            cookie += \"; Secure\"\n                        self.respond(200, {\"ok\": True}, headers={\"Set-Cookie\": cookie})\n                        return\n                    if not self.protected():\n                        return\n                    body = self.body()\n                    if path in (\"/api/generate\", \"/api/jobs\"):\n                        self.respond(200, application.engine.submit(body))\n                        return\n                    match = re.fullmatch(r\"/api/jobs/([a-f0-9]{32})/recover\", path)\n                    if match:\n                        if body:\n                            raise ValueError(\"คำขอกู้ผลต้องไม่แก้ค่าของงานเดิม\")\n                        self.respond(200, application.engine.recover(match.group(1)))\n                        return\n                    self.error(404, \"ไม่พบคำสั่งนี้\")\n                except EngineError as error:\n                    self.error(409, error)\n                except ValueError as error:\n                    self.error(400, error)\n                except (OSError, TimeoutError):\n                    self.error(503, \"ติดต่อ GPU หรือบันทึกคำขอไม่ได้ ตรวจงานเดิมก่อนกดสร้างซ้ำ\")\n                except Exception:\n                    self.error(500, \"ระบบสร้างภาพขัดข้อง ตรวจสถานะก่อนกดสร้างซ้ำ\")\n\n        return Handler\n\n\ndef main():\n    server = None\n    engine = None\n    try:\n        port = int(os.environ.get(\"APP_PORT\", \"5000\"))\n        if not 1024 <= port <= 65535:\n            raise ValueError(\"APP_PORT ต้องเป็นพอร์ต 1024–65535\")\n        engine = Engine(os.environ.get(\"STUDIO_DATA_ROOT\", \"/workspace/image-studio-data\"),\n                        os.environ.get(\"MODELS_ROOT\", \"/workspace/models\"),\n                        os.environ.get(\"COMFY_INTERNAL_PORT\", \"8189\"))\n        application = Application(engine, os.environ.get(\"IMAGE_STUDIO_CODE\", \"\"),\n                                  public_origin=public_origin_from_env(port))\n        server = ThreadingHTTPServer((\"0.0.0.0\", port), application.handler())\n        print(\"IMAGE_STUDIO_APP_STARTED\", flush=True)\n        server.serve_forever()\n    except KeyboardInterrupt:\n        pass\n    except Exception as error:\n        print(\"IMAGE_STUDIO_APP_FAILED: \" + (str(error)[:400] if isinstance(error, ValueError)\n                                              else \"ตรวจ Logs ของ Pod และค่า Deploy\"), flush=True)\n        raise SystemExit(1)\n    finally:\n        if engine:\n            engine.close()\n        if server:\n            server.server_close()\n\n\nif __name__ == \"__main__\":\n    main()\n", "tests/test_proxy_origin.py": "\"\"\"ตรวจ Origin ผ่าน proxy แบบออฟไลน์; ไม่ใช้ GPU หรือเรียกบริการ RunPod.\"\"\"\nfrom http.cookies import SimpleCookie\nfrom http.server import ThreadingHTTPServer\nimport os\nfrom pathlib import Path\nimport sys\nimport tempfile\nimport threading\nimport unittest\nfrom unittest.mock import patch\n\nimport requests\n\nROOT = Path(__file__).resolve().parents[1]\nsys.path.insert(0, str(ROOT))\nsys.path.insert(0, str(ROOT / \"tests\"))\nimport app\nfrom test_app_engine import FakeEngine\n\n\nPUBLIC_ORIGIN = \"https://eowz5yfcsqwgec-5000.proxy.runpod.net\"\n\n\nclass OriginConfigTests(unittest.TestCase):\n    def test_canonical_origin_normalizes_case_and_default_ports(self):\n        for value, expected in (\n            (\"https://EXAMPLE.TEST\", \"https://example.test\"),\n            (\"https://example.test:443\", \"https://example.test\"),\n            (\"https://example.test/\", \"https://example.test\"),\n            (\"http://localhost:80\", \"http://localhost\"),\n            (\"http://127.0.0.1:8767\", \"http://127.0.0.1:8767\"),\n            (PUBLIC_ORIGIN, PUBLIC_ORIGIN),\n        ):\n            with self.subTest(value=value):\n                self.assertEqual(app.canonical_origin(value), expected)\n\n    def test_canonical_origin_rejects_non_origin_values(self):\n        # ห้าม URL ที่มี credential/path หรือ Origin หลายค่าเล็ดลอดมาเป็น allowlist\n        for value in (\n            \"\", \"null\", \"example.test\", \"//example.test\", \"ftp://example.test\",\n            \"javascript://example.test\", \"https://user:pass@example.test\",\n            \"https://example.test/path\", \"https://example.test//\",\n            \"https://example.test?query=yes\", \"https://example.test#fragment\",\n            \"https://example.test,https://attacker.example\",\n            \" https://example.test\", \"https://example.test \",\n            \"https://exam\\tple.test\", \"https://example.test\\n\",\n            \"https://example.test:wrong\", \"https://example.test:65536\",\n        ):\n            with self.subTest(value=value), self.assertRaises(ValueError):\n                app.canonical_origin(value)\n\n    def test_no_pod_or_explicit_origin_keeps_local_mode(self):\n        with patch.dict(os.environ, {}, clear=True):\n            self.assertIsNone(app.public_origin_from_env(5000))\n\n    def test_runpod_origin_uses_pod_id_and_app_port(self):\n        with patch.dict(os.environ, {\"RUNPOD_POD_ID\": \"eowz5yfcsqwgec\"}, clear=True):\n            self.assertEqual(app.public_origin_from_env(5000), PUBLIC_ORIGIN)\n            self.assertEqual(app.public_origin_from_env(5010),\n                             \"https://eowz5yfcsqwgec-5010.proxy.runpod.net\")\n\n    def test_explicit_origin_is_https_and_takes_precedence(self):\n        with patch.dict(os.environ, {\"RUNPOD_POD_ID\": \"otherpod12345\",\n                                     \"IMAGE_STUDIO_PUBLIC_ORIGIN\": \"https://IMAGES.EXAMPLE.TEST:443/\"}, clear=True):\n            self.assertEqual(app.public_origin_from_env(5000), \"https://images.example.test\")\n        for value in (\"http://example.test\", \"https://example.test/path\", \"null\"):\n            with self.subTest(value=value), patch.dict(os.environ, {\"IMAGE_STUDIO_PUBLIC_ORIGIN\": value}, clear=True):\n                with self.assertRaises(ValueError):\n                    app.public_origin_from_env(5000)\n\n    def test_invalid_runpod_id_and_port_fail_closed(self):\n        for value in (\"short\", \"OTHERPOD12345\", \"pod.example\", \"pod/123456\", \"pod-123456\",\n                      \"pod123456\\n\", \"a\" * 65):\n            with self.subTest(pod=value), patch.dict(os.environ, {\"RUNPOD_POD_ID\": value}, clear=True):\n                with self.assertRaises(ValueError):\n                    app.public_origin_from_env(5000)\n        for port in (0, 1023, 65536):\n            with self.subTest(port=port), patch.dict(os.environ, {\"RUNPOD_POD_ID\": \"eowz5yfcsqwgec\"}, clear=True):\n                with self.assertRaises(ValueError):\n                    app.public_origin_from_env(port)\n\n    def test_application_rejects_invalid_configured_origin(self):\n        for value in (\"null\", \"https://user:pass@example.test\", \"https://example.test/path\"):\n            with self.subTest(value=value), self.assertRaises(ValueError):\n                app.Application(None, \"safe_test_code_123456789012\", public_origin=value)\n\n\nclass ProxyOriginHttpTests(unittest.TestCase):\n    def setUp(self):\n        self.temp = tempfile.TemporaryDirectory()\n        self.engine = FakeEngine(self.temp.name)\n        self.engine.readiness(force=True)\n        self.code = \"safe_test_code_123456789012\"\n        self.application = app.Application(self.engine, self.code, public_origin=PUBLIC_ORIGIN)\n        self.server = ThreadingHTTPServer((\"127.0.0.1\", 0), self.application.handler())\n        self.thread = threading.Thread(target=self.server.serve_forever, daemon=True)\n        self.thread.start()\n        self.base = \"http://127.0.0.1:\" + str(self.server.server_port)\n        self.client = requests.Session()\n        self.client.trust_env = False\n        self.client.headers.update({\"X-Requested-With\": \"ImageStudio\", \"Host\": \"127.0.0.1:5000\"})\n\n    def tearDown(self):\n        self.engine.close()\n        for worker in self.engine.workers.values():\n            worker.join(2)\n        self.server.shutdown()\n        self.server.server_close()\n        self.thread.join(2)\n        self.client.close()\n        self.temp.cleanup()\n\n    def login(self, **headers):\n        return self.client.post(self.base + \"/api/login\", json={\"code\": self.code}, headers=headers, timeout=5)\n\n    def login_cookie(self):\n        response = self.login(Origin=PUBLIC_ORIGIN)\n        self.assertEqual(response.status_code, 200)\n        parsed = SimpleCookie()\n        parsed.load(response.headers[\"Set-Cookie\"])\n        # จำลอง browser HTTPS โดยไม่ลด Secure cookie เพื่อให้เรียกเซิร์ฟเวอร์ทดสอบ HTTP ได้\n        return \"image_session=\" + parsed[\"image_session\"].value\n\n    def test_proxy_origin_with_internal_host_can_login_and_generate(self):\n        cookie = self.login_cookie()\n        result = self.client.post(self.base + \"/api/jobs\", json={\"id\": \"a\" * 32, \"prompt\": \"a garden\"},\n                                  headers={\"Origin\": PUBLIC_ORIGIN, \"Cookie\": cookie}, timeout=5)\n        self.assertEqual(result.status_code, 200)\n        self.engine.workers[\"a\" * 32].join(3)\n        self.assertEqual(self.engine.get_job(\"a\" * 32)[\"status\"], \"succeeded\")\n        self.assertEqual(len(self.engine.posts), 1)\n\n    def test_https_public_origin_sets_secure_cookie_without_forwarded_header(self):\n        response = self.login(Origin=PUBLIC_ORIGIN)\n        self.assertEqual(response.status_code, 200)\n        cookie = response.headers[\"Set-Cookie\"]\n        for value in (\"Secure\", \"HttpOnly\", \"SameSite=Strict\"):\n            self.assertIn(value, cookie)\n        self.assertNotIn(\"Access-Control-Allow-Origin\", response.headers)\n\n    def test_attacker_host_is_not_a_fallback_for_configured_origin(self):\n        response = self.login(Origin=\"https://attacker.example\", Host=\"attacker.example\")\n        self.assertEqual(response.status_code, 403)\n        self.assertFalse(self.application.sessions)\n\n    def test_other_pod_port_scheme_and_lookalike_origins_are_blocked(self):\n        for origin in (\n            \"https://otherpod12345-5000.proxy.runpod.net\",\n            \"https://eowz5yfcsqwgec-8188.proxy.runpod.net\",\n            \"http://eowz5yfcsqwgec-5000.proxy.runpod.net\",\n            \"https://eowz5yfcsqwgec-5000.proxy.runpod.net.attacker.example\",\n            \"https://attacker.example\", \"null\", \"https://user:pass@eowz5yfcsqwgec-5000.proxy.runpod.net\",\n            PUBLIC_ORIGIN + \"/path\", PUBLIC_ORIGIN + \"?query=yes\", PUBLIC_ORIGIN + \"#fragment\",\n            PUBLIC_ORIGIN + \",https://attacker.example\",\n        ):\n            with self.subTest(origin=origin):\n                self.assertEqual(self.login(Origin=origin).status_code, 403)\n        self.assertFalse(self.application.sessions)\n\n    def test_spoofed_forwarded_headers_do_not_authorize_foreign_origin(self):\n        response = self.login(**{\"Origin\": \"https://attacker.example\",\n                                  \"X-Forwarded-Host\": \"eowz5yfcsqwgec-5000.proxy.runpod.net\",\n                                  \"X-Forwarded-Proto\": \"https\",\n                                  \"Forwarded\": 'host=\"eowz5yfcsqwgec-5000.proxy.runpod.net\";proto=https'})\n        self.assertEqual(response.status_code, 403)\n\n    def test_correct_origin_still_requires_requested_with_marker(self):\n        for marker in (\"\", \"bad\", \"XMLHttpRequest\"):\n            with self.subTest(marker=marker):\n                response = self.login(**{\"Origin\": PUBLIC_ORIGIN, \"X-Requested-With\": marker})\n                self.assertEqual(response.status_code, 403)\n\n    def test_foreign_origin_cannot_submit_even_with_valid_session(self):\n        cookie = self.login_cookie()\n        response = self.client.post(self.base + \"/api/jobs\", json={\"id\": \"a\" * 32, \"prompt\": \"a garden\"},\n                                    headers={\"Origin\": \"https://attacker.example\", \"Host\": \"attacker.example\",\n                                             \"Cookie\": cookie}, timeout=5)\n        self.assertEqual(response.status_code, 403)\n        self.assertFalse(self.engine.jobs)\n        self.assertEqual(self.engine.posts, [])\n\n    def test_missing_origin_with_marker_preserves_existing_client_behavior(self):\n        self.assertEqual(self.login().status_code, 200)\n\n    def test_local_mode_accepts_same_host_and_rejects_other_origins(self):\n        # สลับเฉพาะค่าตั้งต้นให้ครอบคลุมโหมด local โดยไม่สร้าง test server ซ้ำ\n        self.application.public_origin = None\n        self.assertEqual(self.login(Origin=self.base, Host=self.base.split(\"//\", 1)[1]).status_code, 200)\n        self.assertEqual(self.login(Origin=\"https://attacker.example\",\n                                    Host=self.base.split(\"//\", 1)[1]).status_code, 403)\n        self.assertEqual(self.login().status_code, 200)\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n"}''')
          proxy_hashes=json.loads(r'''{"app.py": "a18aa11e1c90987533d99094d431b8460eb1b44a2f26ee182860456185a55b89", "tests/test_proxy_origin.py": "3476dd9fdb509cfa39542570ce6ab10adc796431aab8999790de3ece70881dff"}''')
          assert set(proxy_files)==set(proxy_hashes)=={'app.py','tests/test_proxy_origin.py'}
          assert not (root/'tests/test_proxy_origin.py').exists(), 'Proxy tests unexpectedly already present'
          for name,text in proxy_files.items():
